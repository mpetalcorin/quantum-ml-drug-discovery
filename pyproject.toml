[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-ml-drug-discovery"
version = "0.1.0"
description = "Physics-grounded delta learning for molecular energetics and drug discovery"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "ase>=3.23",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
qm = ["pyscf>=2.7"]
ml = [
  "torch>=2.2",
  "torch-geometric>=2.5",
  "e3nn>=0.5.1",
]
notebook = ["jupyter>=1.0", "ipykernel>=6.29", "nbformat>=5.10"]
test = ["pytest>=8.0", "ruff>=0.6"]
all = [
  "rdkit>=2024.3",
  "pyscf>=2.7",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "e3nn>=0.5.1",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
